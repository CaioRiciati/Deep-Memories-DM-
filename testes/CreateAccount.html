<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de conta</title>
    <link rel="stylesheet" href="CreateAccount.css">
    <title>Criação de Login - Deep Memories</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="../scripts/server.js"></script>
</head>

<body>
  <div class="background">
    <img src="../Imagens/nuvem-esquerda.png" class="nuvem-topo" alt="Nuvem topo esquerda">
    <img src="../Imagens/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
  </div>

  <main class="container">
    <section class="card">
      <h1>Criar conta</h1>
      <div class="logos">
        <img src="../imagens/deepmemories-logo.png" alt="Logo Simbiótica">
        <div class="divisor"></div>
        <img src="../imagens/1.png" alt="Deep Memories">
      </div>
            
      <form method="post" onsubmit="return criarConta()">
        <label for="email"></label>
        <input type="email" name="email" id="email" required placeholder="DIGITE SEU E-MAIL">
        
        <label for="nome"></label>
        <input type="text" name="nome" id="nome" required placeholder="DIGITE SEU NOME">
        
        <label for="usuario"></label>
        <input type="text" name="usuario" id="usuario" required placeholder="CRIE SEU NOME DE USUÁRIO">
        
        <label for="senha"></label>
        <input type="password" name="senha" id="senha" required placeholder="CRIE UMA SENHA">

        <div class="sla">
          <button type="submit" class="confirmar">
            <img src="../Imagens/seta direita.png" alt="confirmar">
          </button>

          <a href="Login.html">Já tem uma conta? Faça login aqui!</a>
        </div>
      </form>


      <div class="divisor-ou">
        <span></span>
        <p>OU</p>
        <span></span>
      </div>

      <div id="g_id_onload" 
          data-client_id="1016933372684-vbsdgu1m4fcj4atq50el9j5enk6i2evi.apps.googleusercontent.com"
          data-login_uri="http://localhost:8080/google-login"
          data-auto_prompt="false">
      </div>

      <div class="g_id_signin" data-type="standard"></div>

    </section>
  </main>

    <script src="../scripts/requisicaoCadastro.js"></script>
</body>
</html>

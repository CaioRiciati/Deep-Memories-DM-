<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Comentários</title>
  <link rel="stylesheet" href="/css/comentarios.css"> <!-- Caminho corrigido -->
</head>
<body>
  <header>
    <div class="logo">
      <img src="/images/2.png" alt="Logo"> <!-- Caminho corrigido -->
      <span>DeepMemories</span>
    </div>
    <a href="/home" class="btn-voltar">← Voltar</a> <!-- Caminho corrigido para rota Spring Boot -->
  </header>

  <main>
    <h1>Comentários</h1>
    <section>
      <!-- O 'action="/comentarios"' está correto se essa for a URL de submissão do formulário no Spring Boot -->
      <form action="/comentarios" method="post">
        <textarea name="texto" placeholder="Escreva seu comentário aqui..." required></textarea>
        <button type="submit">💬 Comentar</button>
      </form>

      <hr>

      <!-- Mostrar comentários com limite -->
      <!-- O código ThymeLeaf (th:if, th:each, th:text, #lists, #temporals) está correto para renderização condicional e iteração -->
      <div th:if="${#lists.isEmpty(comentarios)}" class="sem-comentarios">
        Nenhum comentário ainda.
      </div>

      <div th:each="comentario, iterStat : ${comentarios}" 
           th:if="${iterStat.index < 5}" 
           class="comentario">
        <p>
          <strong th:text="${comentario.nomeUsuario}">Nome</strong> 
          <small>em <span th:text="${#temporals.format(comentario.dataHora, 'dd/MM/yyyy HH:mm')}">data</span></small>
        </p>
        <p th:text="${comentario.texto}">Texto do comentário</p>
      </div>
    </section>
  </main>
</body>
</html>

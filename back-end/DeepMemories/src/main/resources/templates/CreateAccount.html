<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de Login - Deep Memories</title>
    <link rel="stylesheet" href="/css/CreateAccount.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div class="background">
      <img src="/images/nuvem-direita.png" class="nuvem-topo" alt="Nuvem topo esquerda">
      <img src="/images/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
    </div>

    <main class="container">
      <section class="card">
        <h1>Criar conta</h1>
        <div class="logos">
          <img src="/images/deepmemories-logo.png" alt="Logo Simbiótica">
          <div class="divisor"></div>
          <img src="/images/1.png" alt="Deep Memories">
        </div>

        <!-- FORMULÁRIO CORRIGIDO -->
        <form action="/CreateAccount" method="POST" id="formCadastro">
          <label for="email" class="sr-only">E-mail</label>
          <input type="email" name="email" id="email" required placeholder="DIGITE SEU E-MAIL">

          <label for="nome" class="sr-only">Nome</label>
          <input type="text" name="nome" id="nome" required placeholder="DIGITE SEU NOME">

          <label for="nomeUsuario" class="sr-only">Nome de Usuário</label>
          <input type="text" name="nomeUsuario" id="nomeUsuario" required placeholder="CRIE SEU NOME DE USUÁRIO">

          <label for="senha" class="sr-only">Senha</label>
          <input type="password" name="senha" id="senha" required placeholder="CRIE UMA SENHA">

          <div class="sla">
            <button type="submit" class="confirmar">
              <img src="/images/seta direita.png" alt="Confirmar">
            </button>
            <a href="/login">Já tem uma conta? Faça login aqui!</a>
          </div>
        </form>

       
      </section>
    </main>

    <script src="/js/cadastro.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Deep Memories</title> <!-- Título mais claro -->
    <link rel="stylesheet" href="/css/login.css">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="background">
      <img src="/images/nuvem-esquerda.png" class="nuvem-topo" alt="Nuvem topo esquerda">
      <img src="/images/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
    </div>
    
    <main class="container">
      <section class="card">
        <h1>FAZER LOGIN</h1>
        <div class="logos">
          <img src="/images/deepmemories-logo.png" alt="Logo Simbiótica">
          <div class="divisor"></div>
          <img src="/images/1.png" alt="Deep Memories">
        </div>
        <!-- Formulário corrigido para enviar dados ao endpoint /logar -->
        <form method="POST" action="/logar" id="formLogin">
          <label for="email">Digite seu E-mail ou nome de usuário</label>
          <input type="text" name="email" id="email" required>
          <label for="senha">Digite sua senha</label>
          <input type="password" name="senha" id="senha" required>
          <div class="sla">
            <!-- Botão de submit sem o onclick para permitir o envio do formulário -->
            <button type="submit" class="confirmar">
              <img src="/images/seta direita.png" alt="confirmar">
            </button>
            <a href="/RecuperarConta.HTML">ESQUECEU SUA SENHA? CLIQUE AQUI!</a>
          </div>
        </form>
      
      
        <div class="divisor-ou">
          <span></span>
          <p>OU</p>
          <span></span>
        </div>
      
        <div id="g_id_onload" 
          data-client_id="1016933372684-vbsdgu1m4fcj4atq50el9j5enk6i2evi.apps.googleusercontent.com"
          data-login_uri="http://localhost:8080/google-login"
          data-auto_prompt="false">
        </div>
        
        <div class="g_id_signin" data-type="standard"></div>
        
      </section>
    </main>
    
    <!-- Script movido para o final do corpo para otimizar o carregamento -->
    <script src="/js/login.js"></script>

  </body>
</html>

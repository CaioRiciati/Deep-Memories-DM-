<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações de pefil</title>
    <link rel="stylesheet" href="../styles/modUser.css">
</head>
<body>
<div class="background">
    <img src="../Imagens/nuvem-esquerda.png" class="nuvem-topo" alt="Nuvem topo esquerda">
    <img src="../Imagens/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
</div>
  
<main class="container">
    <div class="content">
        <div class="perfil">
            <img src="../Imagens/person.png" alt="foto de perfil">
            <a href="#">Alterar foto de perfil</a>
        </div>

        <form action="get">
            <div class="input-group">
                <label for="email">Seu E-mail</label>
                <div class="input-button">
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    <button type="button" class="open-modal">modificar</button>
                </div>
            </div>

            <div class="input-group">
                <label for="user">Nome de usuário</label>
                    <div class="input-button">
                        <input type="text" id="user" name="user" placeholder="usu_ario" required>
                        <button>modificar</button>
                    </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-button">
                <input type="password" id="password" name="password" placeholder="123@Senha" required>
                    <button>modificar</button>
                </div>
            </div>
        
            <button id="save">Salvar Alterações</button>
        </form>
    </div>
</main>

<section class="container2" id="modal2" aria-hidden="true" role="dialog">
  <div class="content2">
    <div class="sla">
      <label for="email" class="mail">NOVO NOME DE USUARIO</label>
      <div class="input-button">
        <input type="email" id="email" name="email" required class="new-email" class="new-email">
      <label for="email" class="mail">CONFIRME O NOME DE USUARIO</label>
      <div class="input-button">
        <input type="email" id="email" name="email" required class="new-email" class="new-email">
        <button>CONFIRMAR</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criação de conta</title>
    <link rel="stylesheet" href="../styles/contaRecupera.css">
  <title>Criação de Login - Deep Memories</title>

</head>
<body>
  <div class="background">
    <img src="../Imagens/nuvem-esquerda.png" class="nuvem-topo" alt="Nuvem topo esquerda">
    <img src="../Imagens/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
  </div>

  <main class="container">
    <section class="card">
    <h1>Recuperar conta</h1>
      <div class="logos">
        <img src="../imagens/deepmemories-logo.png" alt="Logo Simbiótica">
        <div class="divisor"></div>
        <img src="../imagens/1.png" alt="Deep Memories">
      </div>

      <label for="iuser">DIGITE SEU E-MAIL OU NOME DE USUÁRIO</label>
      <input type="email" name="user" id="iuser">

        <button>Enviar codigo de recuperação</button>

    </section>
  </main>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>
</head>
<body>
  <h1>Cadastro de Usuário</h1>

  <form action="/cadastrar" method="post">
   
    <label for="nome">Nome completo:</label><br>
    <input type="text" id="nome" name="nome" required><br><br>

    
    <label for="email">E-mail:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    
    <label for="senha">Senha:</label><br>
    <input type="password" id="senha" name="senha" required><br><br>

   
    <label for="confirmarSenha">Confirmar senha:</label><br>
    <input type="password" id="confirmarSenha" name="confirmarSenha" required><br><br>

    <label>Gênero:</label><br>
    <input type="radio" id="masculino" name="genero" value="masculino">
    <label for="masculino">Masculino</label><br>
    <input type="radio" id="feminino" name="genero" value="feminino">
    <label for="feminino">Feminino</label><br>
    <input type="radio" id="outro" name="genero" value="outro">
    <label for="outro">Outro</label><br><br>

    <label for="dataNascimento">Data de nascimento:</label><br>
    <input type="date" id="dataNascimento" name="dataNascimento"><br><br>

    <input type="checkbox" id="termos" name="termos" required>
    <label for="termos">Eu aceito os termos e condições</label><br><br>

    <button type="submit">Cadastrar</button>
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações de pefil</title>
    <link rel="stylesheet" href="../styles/InformacoesPerfil.css">
</head>
<body>
<div class="background">
    <img src="../Imagens/nuvem-esquerda.png" class="nuvem-topo" alt="Nuvem topo esquerda">
    <img src="../Imagens/nuvem-direita.png" class="nuvem-baixo" alt="Nuvem inferior direita">
</div>
  
<main class="container">
    <div class="content">
        <div class="perfil">
            <img src="../Imagens/person.png" alt="foto de perfil">
            <a href="#">Alterar foto de perfil</a>
        </div>

        <form action="get">
            <div class="input-group">
                <label for="email">Seu E-mail</label>
                <div class="input-button">
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    <button>modificar</button>
                </div>
            </div>

            <div class="input-group">
                <label for="user">Nome de usuário</label>
                    <div class="input-button">
                        <input type="text" id="user" name="user" placeholder="usu_ario" required>
                        <button>modificar</button>
                    </div>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <div class="input-button">
                <input type="password" id="password" name="password" placeholder="123@Senha" required>
                    <button>modificar</button>
                </div>
            </div>
        
            <button id="save">Salvar Alterações</button>
        </form>
    </div>
</main>

<section class="container2" id="modal" aria-hidden="true" role="dialog">
    <div class="content2">
      <button class="close" type="button" data-close>&times;</button>

      <button class="escolhas">
        <img src="../Imagens/galeria.png" alt="galeria">
        <h2>Escolher na galeria</h2>
      </button>

      <button class="escolhas">
        <img src="../Imagens/google.png" alt="google" class="google">
        <h2>Importar do Google</h2>
      </button>

      <button class="escolhas">
        <img src="../Imagens/lixeira.png" alt="excluir">
        <h2 class="lixeira">Excluir</h2>
      </button>
    </div>
</section>

<section class="container3" id="modal2" aria-hidden="true" role="dialog">
    <div class="content2">
      <button class="close" type="button" data-close>&times;</button>

      <button class="escolhas">
            <div class="input-group">
                <label for="email">Seu E-mail</label>
                <div class="input-button">
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required class="new-email">
                    <button>Enviar código para o novo E-mail</button>
                </div>
      </button>


</section>


  <script src="../scripts/InformacoesPerfil.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Memories - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <div class="login-container">
            <h1 class="title">FAZER LOGIN</h1>
            <div class="logo-container">
                <img src="gitr.png" alt="Logo" class="gitr">
                    <img src="logo.png" alt="Logo" class="logo">
                </div>

            <form class="login-form">
                <p class="form-label">DIGITE SEU E-MAIL OU NOME DE USUÁRIO</p>
                <input type="text" class="input-field" placeholder="">
                
                <p class="form-label">DIGITE SUA SENHA</p>
                <input type="password" class="input-field" placeholder="">

                <button type="submit" class="login-button">ENTRAR</button>
            </form>
            
            <a href="#" class="forgot-password">ESQUECEU SUA SENHA? CLIQUE AQUI</a>
            
            <div class="divider">OU</div>

            <button class="google-login-button">
                <img src="https://www.google.com/favicon.ico"alt="Google Icon" class="google-icon">
                FAZER LOGIN COM GOOGLE
                <script src="https://accounts.google.com/gsi/client" async defer></script>
             </button>
             
        </div>
    </div>
</body>
</html>
